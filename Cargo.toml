[package]
name = "foldcli"
version = "0.1.1"
edition = "2021"
description = "FOLD CLI: a keyboard-first terminal file manager"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Neptunium-Laboratory/Fold-CLI"
keywords = ["cli", "tui", "file-manager", "terminal", "ratatui"]
categories = ["command-line-utilities"]
rust-version = "1.75"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
signal-hook = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true

